server:
  port: ${PORT:8080}

spring:
  application:
    name: weddingos-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:weddingos_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 50MB

# OpenAPI / Swagger UI Documentation Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

cloudinary:
  url: ${CLOUDINARY_URL:}

# Clerk authentication (bearer session tokens). No secrets have defaults.
# CLERK_ISSUER:            e.g. https://<your-instance>.clerk.accounts.dev (required; without it all private routes return 401)
# CLERK_JWKS_URL:          optional; defaults to ${CLERK_ISSUER}/.well-known/jwks.json
# CLERK_AUTHORIZED_PARTIES: comma-separated allowed frontend origins checked against the token's azp claim
# CLERK_AUDIENCE:          optional; only checked when set
# CLERK_SECRET_KEY:        Clerk Backend API key, needed to link first-time sign-ins to existing users by verified email
clerk:
  issuer: ${CLERK_ISSUER:}
  jwks-url: ${CLERK_JWKS_URL:}
  authorized-parties: ${CLERK_AUTHORIZED_PARTIES:}
  audience: ${CLERK_AUDIENCE:}
  secret-key: ${CLERK_SECRET_KEY:}
  api-url: ${CLERK_API_URL:https://api.clerk.com/v1}

